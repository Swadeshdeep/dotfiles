
# ====================================================================================
# Core Settings
# ====================================================================================

set -g prefix C-a
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on

# Terminal — proper 256color + true color (RGB) passthrough
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-ghostty:RGB"
set -sa terminal-overrides ",xterm-kitty:RGB"
set -sa terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -sa terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Indices — 1-indexed, auto-renumber
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Window auto-rename to current directory
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Yazi image preview passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ====================================================================================
# Keybinds
# ====================================================================================

# Splits — preserve current directory
unbind '%'
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Zoom toggle
bind -r m resize-pane -Z

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Clear screen + scrollback (prefix + C-l to avoid vim-tmux-navigator conflict)
bind C-l send-keys C-l \; clear-history

# Kill pane without confirmation
bind x kill-pane

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Quick reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Lazygit in new window
bind G new-window -n 'lazygit' lazygit

# Sessionizer
bind-key f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer.sh"

# ====================================================================================
# Vi Copy Mode
# ====================================================================================

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ====================================================================================
# Status Bar & Styling
# ====================================================================================

set -g status-position bottom
set -g status-interval 1
# set -g status-style "fg=#665c54,bg=default"
# set -g status-left-style "fg=#928374"
# set -g status-left ""
# set -g status-right "#{pomodoro_status}"
#
# # Active window
# set -g window-status-current-style "fg=#7E9CD8,bg=default"
#
# # Inactive windows
# set -g window-status-style "fg=#665c54,bg=default"
#
# # Pane borders — matches your Kanagawa-ish color scheme
# set -g pane-border-style "fg=#665c54"
# set -g pane-active-border-style "fg=#7E9CD8"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# ====================================================================================
# Plugins
# ====================================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# FZF URL picker — prefix + u to extract and open URLs from scrollback
set -g @plugin 'wfxr/tmux-fzf-url'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# set -g @resurrect-processes 'nvim "nvim->NVIM_APPNAME=LazyVim nvim"'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# # Tokyo Night theme (disabled)
set -g @plugin "janoamaral/tokyo-night-tmux"
